name: Test & Deploy Workflow
'on':
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch: null
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check Deployment Window
        id: limvio-check
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
        env:
          LIMVIO_TOKEN: "limvio_084f5e4cdfe5e1bb86a1e8a3508023aa90ba1f1764c69a2bad56a3ee67262d94"
          LIMVIO_BRANCH: ${{ github.base_ref || github.ref_name }}
          LIMVIO_BRANCH_PATTERN: IzaanAnwar-patch-1
        run: |-
          if [ -n "$LIMVIO_BRANCH_PATTERN" ] && [ "$LIMVIO_BRANCH_PATTERN" != "*" ]; then
            case "$LIMVIO_BRANCH" in
              $LIMVIO_BRANCH_PATTERN) ;;
              *)
                echo "Limvio: skipping deployment check (branch '$LIMVIO_BRANCH' does not match policy pattern '$LIMVIO_BRANCH_PATTERN')"
                exit 0
                ;;
            esac
          fi

          payload=$(jq -nc \
            --arg repositoryId 'cmjb291q8000004jsscqiryhd' \
            --arg branch "$LIMVIO_BRANCH" \
            --arg environmentId 'cmjb2ct24000504icoz2gmrvc' \
            '{repositoryId:$repositoryId, branch:$branch, environmentId:$environmentId}'
          )

          curl -X POST https://www.limvio.com/api/check \
            -H "Authorization: Bearer $LIMVIO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            -o response.json

          allowed=$(jq -r '.allowed' response.json)
          if [ "$allowed" != "true" ]; then
            reason=$(jq -r '.reason' response.json)
            echo "::error::Deployment blocked: $reason"
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run build step
        run: echo "Building the project..."
      - name: Run tests
        run: echo "Running tests... (dummy)"
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check Deployment Window
        id: limvio-check
        if: ${{ github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
        env:
          LIMVIO_TOKEN: "limvio_084f5e4cdfe5e1bb86a1e8a3508023aa90ba1f1764c69a2bad56a3ee67262d94"
          LIMVIO_BRANCH: ${{ github.base_ref || github.ref_name }}
          LIMVIO_BRANCH_PATTERN: IzaanAnwar-patch-1
        run: |-
          if [ -n "$LIMVIO_BRANCH_PATTERN" ] && [ "$LIMVIO_BRANCH_PATTERN" != "*" ]; then
            case "$LIMVIO_BRANCH" in
              $LIMVIO_BRANCH_PATTERN) ;;
              *)
                echo "Limvio: skipping deployment check (branch '$LIMVIO_BRANCH' does not match policy pattern '$LIMVIO_BRANCH_PATTERN')"
                exit 0
                ;;
            esac
          fi

          payload=$(jq -nc \
            --arg repositoryId 'cmjb291q8000004jsscqiryhd' \
            --arg branch "$LIMVIO_BRANCH" \
            --arg environmentId 'cmjb2ct24000504icoz2gmrvc' \
            '{repositoryId:$repositoryId, branch:$branch, environmentId:$environmentId}'
          )

          curl -X POST https://www.limvio.com/api/check \
            -H "Authorization: Bearer $LIMVIO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            -o response.json

          allowed=$(jq -r '.allowed' response.json)
          if [ "$allowed" != "true" ]; then
            reason=$(jq -r '.reason' response.json)
            echo "::error::Deployment blocked: $reason"
            exit 1
          fi
 
      - name: Wait for 120 seconds
        run: |
          echo "Waiting for 120 seconds before deployment..."
          sleep 120
          echo "Wait complete!"
      - name: Deploy step
        run: |
          echo "Starting deployment..."
          echo "This is a dummy deploy job."
          echo "Deployment complete ✔️"
