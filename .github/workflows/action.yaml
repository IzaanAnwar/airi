      - synchronize
      - reopened
  workflow_dispatch: null
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run build step
        run: echo "Building the project..."
      - name: Run tests
        run: echo "Running tests... (dummy)"
